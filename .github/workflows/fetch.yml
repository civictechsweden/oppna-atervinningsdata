name: Fetch the data (Deactivated)

# DEACTIVATED: Automated scheduled scraping has been paused.
on:
  workflow_dispatch:
  # schedule:
  #   - cron:  '0 1 * * *' # 1AM every night

jobs:
  scrape:
    name: Fetch the data
    runs-on: ubuntu-latest
    # Deactivated: change to true if you explicitly want to run the scraper manually
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.14'
      - name: Fetch the data
        run: uv run run.py
      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git add .
          git commit -m 'Update the data' || echo "Nothing to commit"
          git push
